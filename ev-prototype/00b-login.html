<!doctype html><html><head><meta charset="utf-8"><title>EVCS</title><link rel="stylesheet" href="base.css"><style>[data-go],[data-toast],[data-sel],[data-tog]{cursor:pointer}
.rip{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(198,244,50,.5);border:2px solid rgba(15,23,20,.6);pointer-events:none;z-index:999;animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(.35);opacity:1}to{transform:scale(1.35);opacity:0}}.hdr{position:absolute;top:50px;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:10}
.hdr .b{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.hdr h2{font-size:18px;font-weight:600;flex:1}
.content{position:absolute;top:112px;left:16px;right:16px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cta{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px 34px;z-index:12}
.cta .pay{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mini .ic{width:42px;height:42px;border-radius:13px;background:var(--ink);color:var(--lime);display:grid;place-items:center;flex:none}
.mini b{display:block;font-size:15px}
.mini span{font-size:13px;color:var(--muted)}

.ct{position:absolute;top:118px;left:20px;right:20px}
.ct h1{font-size:28px;letter-spacing:-.02em;line-height:1.15}
.ct p{color:var(--muted);margin-top:8px}
.ph{margin-top:24px;height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;font-size:18px;font-weight:500}
.ph .cc{padding-right:12px;border-right:1px solid var(--line);color:var(--muted)}
.ph .ed{margin-left:auto;font-size:14px;font-weight:600;color:var(--green)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.otp div{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:600}
.otp .f{border-color:var(--ink)}
.otp .cur{border:2px solid var(--ink);box-shadow:0 0 0 4px rgba(198,244,50,.5)}
.sms{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;background:#F3FBD6;color:#3B4A0E;font-size:13.5px}
.rs{margin-top:14px;font-size:14px;color:var(--muted)}
.rs b{color:var(--ink)}
.legal{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
</style></head><body><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.4 1.4a4.5 4.5 0 0 0-6.4 0zM1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.4 1.4a7.6 7.6 0 0 0-10.8 0z" fill="currentColor"/></svg><span class="bat"></span></span></div>
<div class="hdr"><div class="b" data-go="00-welcome"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="m15 5-7 7 7 7"/></svg></div></div>
<div class="ct"><h1>Enter the code we sent</h1><p>A 6-digit code is on its way by SMS.</p>
<div class="ph"><span class="cc">+91</span>98765 43210<span class="ed" data-go="00-welcome">Edit</span></div>
<div class="otp"><div class="f">4</div><div class="f">8</div><div class="f">2</div><div class="f">6</div><div class="cur"></div><div class=""></div></div>

<div class="home"></div><script>
(function(){
 var P = window.parent !== window;
 function go(t){ if(P) parent.postMessage({go:t},'*'); }
 function toast(m){ if(P) parent.postMessage({toast:m},'*'); }
 window.__go=go; window.__toast=toast;
 document.addEventListener('pointerdown',function(e){var r=document.createElement('i');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(function(){r.remove()},650)});
 document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-toast],[data-sel],[data-tog]'); if(!el) return;
  if(el.dataset.sel){document.querySelectorAll('[data-sel="'+el.dataset.sel+'"]').forEach(function(x){x.classList.remove('on')}); el.classList.add('on');}
  if(el.hasAttribute('data-tog')) el.classList.toggle('on');
  if(el.dataset.toast) toast(el.dataset.toast);
  if(el.dataset.go) go(el.dataset.go);
 });
})();
