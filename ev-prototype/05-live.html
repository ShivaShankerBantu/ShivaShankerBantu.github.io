<!doctype html><html><head><meta charset="utf-8"><title>EVCS</title><link rel="stylesheet" href="base.css"><style>[data-go],[data-toast],[data-sel],[data-tog]{cursor:pointer}
.rip{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(198,244,50,.5);border:2px solid rgba(15,23,20,.6);pointer-events:none;z-index:999;animation:rip .65s ease-out forwards}

.cta .pay{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mini .ic{width:42px;height:42px;border-radius:13px;background:var(--ink);color:var(--lime);display:grid;place-items:center;flex:none}
.mini b{display:block;font-size:15px}
.mini span{font-size:13px;color:var(--muted)}

body{background:#0F1714;color:#fff}
.status{color:#fff}
.hdr .b{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff}
.hdr h2{color:#fff}
.ring{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:270px;height:270px}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c small{font-size:13px;color:#9FAAA4}
.ring .c b{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1}
.ring .c span{font-size:14px;color:var(--lime);display:flex;align-items:center;gap:4px;margin-top:6px}
.stats{position:absolute;top:416px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:#18221E;border:1px solid #24312B;border-radius:18px;padding:14px}
.st small{font-size:12.5px;color:#9FAAA4;display:block}
.st b{font-size:22px;letter-spacing:-.01em}
.st b em{font-style:normal;font-size:14px;color:#9FAAA4;font-weight:500}
.alert{position:absolute;top:600px;left:16px;right:16px;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:#18221E;border:1px solid #24312B;font-size:13.5px;color:#C9D1CC}
.cta{background:#0F1714;border-top-color:#1E2925}
.btn.stop{background:transparent;border:1.5px solid #3A4842;color:#fff}
.home{background:#fff}
