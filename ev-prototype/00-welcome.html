(function(){
 var P = window.parent !== window;
 function go(t){ if(P) parent.postMessage({go:t},'*'); }
 function toast(m){ if(P) parent.postMessage({toast:m},'*'); }
 window.__go=go; window.__toast=toast;
 document.addEventListener('pointerdown',function(e){var r=document.createElement('i');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(function(){r.remove()},650)});
 document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-toast],[data-sel],[data-tog]'); if(!el) return;
  if(el.dataset.sel){document.querySelectorAll('[data-sel="'+el.dataset.sel+'"]').forEach(function(x){x.classList.remove('on')}); el.classList.add('on');}
  if(el.hasAttribute('data-tog')) el.classList.toggle('on');
  if(el.dataset.toast) toast(el.dataset.toast);
  if(el.dataset.go) go(el.dataset.go);
 });
})();
